
<div id="contactApp"></div>

<style>
#contactApp{font-family:Arial,sans-serif;color:#202124;background:#f6f8fc;min-height:100vh;padding:15px;box-sizing:border-box}
#contactApp *{box-sizing:border-box}
#contactApp .top{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-bottom:20px}
#contactApp h2{font-size:25px;margin:5px 0}
#contactApp button{border:0;border-radius:22px;padding:11px 16px;cursor:pointer;font-weight:600;background:#1769aa;color:white}
#contactApp button.secondary{background:#e8eef7;color:#234}
#contactApp input,#contactApp textarea{width:100%;padding:13px;border:1px solid #dadce0;border-radius:10px;margin:6px 0 12px;font-size:15px;background:white;color:#202124}
#contactApp .search{border-radius:25px;background:white}
#contactApp .tools{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
#contactApp .contact{background:white;border-radius:15px;padding:13px;margin:9px 0;display:flex;align-items:center;gap:12px;box-shadow:0 1px 4px #0000000c}
#contactApp .avatar{width:49px;height:49px;border-radius:50%;object-fit:cover;background:#dce8f8;display:grid;place-items:center;font-size:19px;font-weight:bold;color:#245}
#contactApp .details{flex:1;min-width:0}
#contactApp .details b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#contactApp .details small{color:#687078;display:block;margin-top:5px}
#contactApp .actions{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
#contactApp .actions button{padding:8px 10px;font-size:12px}
#contactApp .modal{position:fixed;inset:0;background:#0009;z-index:99999;display:none;align-items:center;justify-content:center;padding:12px}
#contactApp .modalbox{background:white;border-radius:18px;padding:20px;width:100%;max-width:480px;max-height:90vh;overflow:auto}
#contactApp .modalbox h3{margin-top:0}
#contactApp .grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
#contactApp .full{grid-column:1/-1}
#contactApp .hidden{display:none!important}
#contactApp .empty{text-align:center;color:#777;padding:35px}
#contactApp .status{font-size:13px;color:#667;margin:8px 0}
#contactApp .star{background:#fff2cc!important;color:#805b00!important}
@media(max-width:480px){
#contactApp .contact{align-items:flex-start;flex-wrap:wrap}
#contactApp .actions{width:100%;justify-content:flex-start;padding-left:60px}
#contactApp .grid{grid-template-columns:1fr}
#contactApp .full{grid-column:auto}
}
</style>

<script>
(function(){
'use strict';

const root=document.getElementById('contactApp');
if(!root)return;

/*
 Tumia Firebase ambayo tayari imeanzishwa
 kwenye website yako. Usitengeneze Firebase App mpya.
*/
if(!window.firebase){
 root.innerHTML='<div class="empty">Firebase haijapakiwa. Hakikisha Firebase SDK ipo kwenye website yako.</div>';
 return;
}

const auth=window.firebase.auth();
const db=window.firebase.firestore();
const storage=window.firebase.storage();

let currentUser=null;
let contacts=[];
let unsubscribe=null;
let editing=null;
let selectedPhoto=null;

root.innerHTML=`
<div class="top">
 <div><h2>👥 Contacts</h2><div class="status" id="count">Contacts zako</div></div>
 <button id="add">＋ Add contact</button>
</div>

<input class="search" id="search" placeholder="🔍 Search contacts">

<div class="tools">
 <button class="secondary" id="all">All contacts</button>
 <button class="secondary" id="fav">⭐ Favorites</button>
 <button class="secondary" id="import">Import VCF</button>
 <button class="secondary" id="export">Export VCF</button>
</div>

<div id="list"></div>

<div class="modal" id="modal">
 <div class="modalbox">
  <h3 id="formTitle">Create contact</h3>
  <form id="contactForm">
   <label>Contact photo</label>
   <input type="file" id="photo" accept="image/*">
   <div class="grid">
    <div class="full"><label>Full name *</label><input id="name" required placeholder="Full name"></div>
    <div class="full"><label>Phone number *</label><input id="phone" required type="tel" placeholder="+255..."></div>
    <div class="full"><label>Other phone number</label><input id="phone2" type="tel" placeholder="Optional"></div>
    <div><label>Email</label><input id="email" type="email"></div>
    <div><label>Company</label><input id="company"></div>
    <div><label>Job title</label><input id="job"></div>
    <div><label>Birthday</label><input id="birthday" type="date"></div>
    <div class="full"><label>Address</label><input id="address"></div>
    <div class="full"><label>Notes</label><textarea id="notes" rows="3"></textarea></div>
   </div>
   <div class="tools">
    <button type="submit" id="save">Save contact</button>
    <button type="button" class="secondary" id="cancel">Cancel</button>
   </div>
   <div class="status" id="formStatus"></div>
  </form>
 </div>
</div>
`;

const $=id=>root.querySelector('#'+id);
const esc=s=>String(s||'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const cleanPhone=p=>String(p||'').replace(/[^\d+]/g,'');
const path=()=>db.collection('users').doc(currentUser.uid).collection('contacts');

function message(t){$('formStatus').textContent=t;}

function openForm(c=null){
 editing=c?c.id:null;
 selectedPhoto=null;
 $('contactForm').reset();
 $('formTitle').textContent=c?'Edit contact':'Create contact';
 $('name').value=c?.name||'';
 $('phone').value=c?.phone||'';
 $('phone2').value=c?.phone2||'';
 $('email').value=c?.email||'';
 $('company').value=c?.company||'';
 $('job').value=c?.job||'';
 $('birthday').value=c?.birthday||'';
 $('address').value=c?.address||'';
 $('notes').value=c?.notes||'';
 $('photo').value='';
 $('save').disabled=false;
 message('');
 $('modal').style.display='flex';
}

function closeForm(){$('modal').style.display='none';}

function render(favoritesOnly=false){
 const q=$('search').value.toLowerCase().trim();
 const data=contacts.filter(c=>
 (!favoritesOnly||c.favorite)&&
 [c.name,c.phone,c.phone2,c.email,c.company].join(' ').toLowerCase().includes(q)
 );
 $('count').textContent=contacts.length+' contacts';
 $('list').innerHTML=data.length?data.map(c=>`
 <div class="contact">
  ${c.photo
   ?`<img class="avatar" src="${esc(c.photo)}" alt="">`
   :`<div class="avatar">${esc((c.name||'?').charAt(0).toUpperCase())}</div>`}
  <div class="details">
   <b>${esc(c.name)} ${c.favorite?'⭐':''}</b>
   <small>${esc(c.phone)}</small>
   <small>${esc(c.email||c.company||'')}</small>
  </div>
  <div class="actions">
   <button onclick="window.contactCall('${c.id}')">Call</button>
   <button class="secondary" onclick="window.contactWhatsApp('${c.id}')">WA</button>
   <button class="secondary" onclick="window.contactEdit('${c.id}')">Edit</button>
   <button class="secondary star" onclick="window.contactStar('${c.id}')">★</button>
   <button class="secondary" onclick="window.contactDelete('${c.id}')">×</button>
  </div>
 </div>`).join(''):'<div class="empty">Hakuna contacts zilizopatikana.</div>';
}

function find(id){return contacts.find(c=>c.id===id);}

window.contactCall=id=>{
 const c=find(id);if(c?.phone)location.href='tel:'+cleanPhone(c.phone);
};
window.contactWhatsApp=id=>{
 const c=find(id);if(c?.phone)window.open('https://wa.me/'+cleanPhone(c.phone).replace('+',''),'_blank');
};
window.contactEdit=id=>{const c=find(id);if(c)openForm(c);};

window.contactStar=async id=>{
 const c=find(id);if(!c)return;
 await path().doc(id).update({favorite:!c.favorite});
};

window.contactDelete=async id=>{
 const c=find(id);if(!c)return;
 if(!confirm('Una uhakika unataka kufuta '+c.name+'?'))return;
 try{
  await path().doc(id).delete();
  if(c.photoPath)await storage.ref(c.photoPath).delete().catch(()=>{});
 }catch(e){alert('Imeshindikana kufuta: '+e.message);}
};

$('add').onclick=()=>openForm();
$('cancel').onclick=closeForm;
$('search').oninput=()=>render(window.contactFavorites||false);
$('all').onclick=()=>{window.contactFavorites=false;render(false);};
$('fav').onclick=()=>{window.contactFavorites=true;render(true);};

$('photo').onchange=e=>{
 selectedPhoto=e.target.files[0]||null;
};

$('contactForm').onsubmit=async e=>{
 e.preventDefault();
 if(!currentUser)return;
 const btn=$('save');
 btn.disabled=true;
 message('Inahifadhi...');

 try{
  const data={
   name:$('name').value.trim(),
   phone:$('phone').value.trim(),
   phone2:$('phone2').value.trim(),
   email:$('email').value.trim(),
   company:$('company').value.trim(),
   job:$('job').value.trim(),
   birthday:$('birthday').value,
   address:$('address').value.trim(),
   notes:$('notes').value.trim(),
   updatedAt:firebase.firestore.FieldValue.serverTimestamp()
  };

  if(!data.name||!data.phone)throw new Error('Jaza jina na namba ya simu.');

  let id=editing||db.collection('_contactIds').doc().id;
  let photoPath=null;
  let old=find(id);

  if(selectedPhoto){
   if(!selectedPhoto.type.startsWith('image/'))throw new Error('Chagua picha sahihi.');
   if(selectedPhoto.size>5*1024*1024)throw new Error('Picha isizidi 5 MB.');
   photoPath='users/'+currentUser.uid+'/contacts/'+id+'/'+Date.now();
   const ref=storage.ref(photoPath);
   await ref.put(selectedPhoto);
   data.photo=await ref.getDownloadURL();
   data.photoPath=photoPath;
  }else if(old){
   data.photo=old.photo||'';
   data.photoPath=old.photoPath||'';
  }

  if(!editing){
   data.favorite=false;
   data.createdAt=firebase.firestore.FieldValue.serverTimestamp();
  }

  await path().doc(id).set(data,{merge:true});

  if(selectedPhoto&&old?.photoPath&&old.photoPath!==photoPath)
   await storage.ref(old.photoPath).delete().catch(()=>{});

  closeForm();
 }catch(err){message('Hitilafu: '+err.message);}
 finally{btn.disabled=false;}
};

/* VCF import */
$('import').onclick=()=>{
 const f=document.createElement('input');
 f.type='file';f.accept='.vcf,text/vcard';
 f.onchange=async()=>{
  const file=f.files[0];if(!file)return;
  try{
   const txt=(await file.text()).replace(/\r?\n[ \t]/g,'');
   const cards=txt.split(/BEGIN:VCARD/i).slice(1);
   let total=0;
   for(const card of cards){
    const name=(card.match(/^FN:(.*)$/im)||[])[1]||'';
    const phone=(card.match(/^TEL[^:]*:(.*)$/im)||[])[1]||'';
    const email=(card.match(/^EMAIL[^:]*:(.*)$/im)||[])[1]||'';
    if(name.trim()&&phone.trim()){
     await path().add({
      name:name.trim(),phone:phone.trim(),phone2:'',
      email:email.trim(),favorite:false,
      createdAt:firebase.firestore.FieldValue.serverTimestamp()
     });
     total++;
    }
   }
   alert(total+' contacts zimeingizwa.');
  }catch(e){alert('Imeshindikana ku-import: '+e.message);}
 };
 f.click();
};

/* VCF export */
$('export').onclick=()=>{
 if(!contacts.length){alert('Hakuna contacts za ku-export.');return;}
 const data=contacts.map(c=>
 'BEGIN:VCARD\r\nVERSION:3.0\r\nFN:'+c.name+
 '\r\nTEL;TYPE=CELL:'+c.phone+
 (c.phone2?'\r\nTEL;TYPE=OTHER:'+c.phone2:'')+
 (c.email?'\r\nEMAIL:'+c.email:'')+
 (c.company?'\r\nORG:'+c.company:'')+
 '\r\nEND:VCARD'
 ).join('\r\n');
 const blob=new Blob([data],{type:'text/vcard'});
 const a=document.createElement('a');
 a.href=URL.createObjectURL(blob);a.download='My-Contacts.vcf';a.click();
 URL.revokeObjectURL(a.href);
};

/* Tumia session ya login iliyopo */
const authUnsubscribe=auth.onAuthStateChanged(user=>{
 if(unsubscribe){unsubscribe();unsubscribe=null;}
 currentUser=user;
 if(!user){
  contacts=[];
  $('list').innerHTML='<div class="empty">Inasubiri akaunti ya mtumiaji kuingia.</div>';
  return;
 }
 unsubscribe=path().orderBy('name').onSnapshot(snapshot=>{
  contacts=snapshot.docs.map(d=>({id:d.id,...d.data()}));
  render(window.contactFavorites||false);
 },error=>{
  $('list').innerHTML='<div class="empty">Tatizo la kusoma contacts: '+esc(error.message)+'</div>';
 });
});

/* Ruhusu parent website kufunga module inapobadilisha ukurasa */
window.contactModuleCleanup=()=>{
 if(unsubscribe)unsubscribe();
 authUnsubscribe();
};
})();
</script>
